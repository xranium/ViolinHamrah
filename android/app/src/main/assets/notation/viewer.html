<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <script src="opensheetmusicdisplay.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; background: #faf9f5;
      overflow-x: hidden; overflow-y: auto; direction: ltr !important;
      -webkit-font-smoothing: antialiased; font-family: sans-serif;
    }
    #osmdContainer {
      width: 100%; min-height: 100%; padding: 8px 6px 12px 6px;
      direction: ltr !important; background: #faf9f5;
    }
    svg { background: transparent !important; display: block; margin: 0 auto; }
    .osmd-cursor {
      transition: all 0.15s ease-out;
      border-left: 3px solid #2563eb !important;
      opacity: 0.85 !important;
      box-shadow: 0 0 6px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body>
  <div id="osmdContainer"></div>
  <script>
    let osmd = null, isReady = false, isLoading = false, noteSvgs = [], currentCursorIndex = 0;
    let lastUserInteraction = 0;
    const pendingNotesToColor = {}, COOLDOWN_MS = 3000;
    let pendingCursor = null;
    let currentScale = 0.88;

    window.setScoreScale = function(scalePercent) {
      const zoomVal = Math.max(0.4, Math.min(2.5, ((scalePercent || 100) / 100.0) * 0.88));
      if (Math.abs(currentScale - zoomVal) < 0.01) return;
      currentScale = zoomVal;
      if (!osmd || isLoading) return;
      try {
        osmd.zoom = currentScale;
        osmd.render();
        cacheNoteElements();
        if (osmd.cursor) {
          osmd.cursor.show();
          const target = currentCursorIndex;
          osmd.cursor.reset();
          currentCursorIndex = 0;
          while (currentCursorIndex < target && !osmd.cursor.iterator.EndReached) {
            osmd.cursor.next();
            currentCursorIndex++;
          }
        }
      } catch (e) {
        console.error('Error scaling score:', e);
      }
    };

    function recordInteraction() { lastUserInteraction = Date.now(); }
    window.addEventListener('touchstart', recordInteraction, { passive: true });
    window.addEventListener('touchmove', recordInteraction, { passive: true });
    window.addEventListener('wheel', recordInteraction, { passive: true });

    function canAutoScroll() { return (Date.now() - lastUserInteraction) > COOLDOWN_MS; }

    window.onload = function() {
      const container = document.getElementById('osmdContainer');
      osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(container, {
        autoResize: true, backend: 'svg',
        drawTitle: false, drawSubtitle: false, drawComposer: false,
        drawPartNames: false, followCursor: false, drawingParameters: 'default'
      });
      isReady = true;
      if (window.pendingXml) { window.loadScore(window.pendingXml); window.pendingXml = null; }
    };

    function cacheNoteElements() {
      noteSvgs = [];
      if (!osmd || !osmd.cursor) return;
      try {
        osmd.cursor.reset();
        while (!osmd.cursor.iterator.EndReached) {
          const gNotes = osmd.cursor.GNotesUnderCursor();
          let el = null;
          if (gNotes && gNotes.length > 0) {
            for (let i = 0; i < gNotes.length; i++) {
              const gn = gNotes[i];
              if (gn) {
                if (typeof gn.getSVGGElement === 'function') el = gn.getSVGGElement();
                if (!el && typeof gn.getVFNoteSVG === 'function') el = gn.getVFNoteSVG();
                if (el) break;
              }
            }
          }
          noteSvgs.push(el);
          osmd.cursor.next();
        }
      } catch (e) {
        console.error('Error caching notes:', e);
      } finally {
        osmd.cursor.reset();
        currentCursorIndex = 0;
      }
    }

    window.loadScore = function(xml) {
      if (!isReady || !osmd) { window.pendingXml = xml; return; }
      try {
        isLoading = true;
        window.resetNoteColors();
        osmd.load(xml).then(function() {
          osmd.zoom = currentScale;
          osmd.render();
          if (osmd.cursor) {
            osmd.cursor.show();
            osmd.cursor.reset();
            currentCursorIndex = 0;
            const elem = osmd.cursor.cursorElement;
            if (elem) elem.classList.add('osmd-cursor');
          }
          cacheNoteElements();
          isLoading = false;
          for (const idx in pendingNotesToColor) {
            window.setNoteColor(parseInt(idx, 10), pendingNotesToColor[idx]);
            delete pendingNotesToColor[idx];
          }
          if (pendingCursor) {
            window.setCursor(pendingCursor.index, pendingCursor.colorHex);
            pendingCursor = null;
          }
        }).catch(function(err) { isLoading = false; console.error('OSMD load error:', err); });
      } catch (e) { isLoading = false; console.error('Exception loading score:', e); }
    };

    window.setNoteColor = function(index, colorHex) {
      if (isLoading || !noteSvgs || noteSvgs.length === 0) {
        pendingNotesToColor[index] = colorHex;
        return;
      }
      if (index < 0 || index >= noteSvgs.length) return;
      const el = noteSvgs[index];
      if (!el) return;
      try {
        el.style.fill = colorHex;
        el.style.stroke = colorHex;
        const children = el.querySelectorAll('path, ellipse, circle');
        for (let i = 0; i < children.length; i++) {
          children[i].style.fill = colorHex;
          children[i].style.stroke = colorHex;
        }
      } catch (e) { console.error('Error in setNoteColor:', e); }
    };

    window.resetNoteColors = function() {
      for (const k in pendingNotesToColor) delete pendingNotesToColor[k];
      if (!noteSvgs) return;
      for (let i = 0; i < noteSvgs.length; i++) {
        const el = noteSvgs[i];
        if (el) {
          try {
            el.style.fill = ''; el.style.stroke = '';
            const children = el.querySelectorAll('path, ellipse, circle');
            for (let j = 0; j < children.length; j++) {
              children[j].style.fill = ''; children[j].style.stroke = '';
            }
          } catch (e) {}
        }
      }
    };

    window.setCursor = function(index, colorHex) {
      if (!osmd || !osmd.cursor || isLoading) {
        pendingCursor = { index: index, colorHex: colorHex };
        return;
      }
      try {
        const targetIndex = Math.max(0, index);
        if (targetIndex < currentCursorIndex) {
          osmd.cursor.reset();
          currentCursorIndex = 0;
        }
        while (currentCursorIndex < targetIndex && !osmd.cursor.iterator.EndReached) {
          osmd.cursor.next();
          currentCursorIndex++;
        }
        const cursorElem = osmd.cursor.cursorElement;
        if (cursorElem) {
          const color = colorHex || '#2563eb';
          cursorElem.style.borderLeftColor = color;
          cursorElem.style.boxShadow = '0 0 8px ' + color;
          if (canAutoScroll()) {
            const vh = window.innerHeight || document.documentElement.clientHeight;
            const rect = cursorElem.getBoundingClientRect();
            if (rect.top < vh * 0.12 || rect.bottom > vh * 0.75) {
              cursorElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }
        }
      } catch (e) { console.error('Error in setCursor:', e); }
    };
  </script>
</body>
</html>
