<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <script src="opensheetmusicdisplay.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow-x: hidden;
      overflow-y: auto;
      direction: ltr !important;
      -webkit-font-smoothing: antialiased;
      font-family: sans-serif;
    }
    #osmdContainer {
      width: 100%;
      min-height: 100%;
      padding: 18px 12px 70px 12px;
      direction: ltr !important;
      background: #ffffff;
    }
    svg {
      background: #ffffff !important;
      display: block;
      margin: 0 auto;
    }
    /* Trala-style clean high-contrast notation */
    .osmd-cursor {
      transition: all 0.15s ease-out;
      border-left: 3px solid #2563eb !important;
      opacity: 0.85 !important;
      box-shadow: 0 0 6px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body>
  <div id="osmdContainer"></div>
  <script>
    let osmd = null;
    let isReady = false;

    window.onload = function() {
      const container = document.getElementById('osmdContainer');
      osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(container, {
        autoResize: true,
        backend: 'svg',
        drawTitle: true,
        drawComposer: true,
        followCursor: true,
        drawPartNames: false,
        drawingParameters: 'default'
      });
      isReady = true;
      if (window.pendingXml) {
        window.loadScore(window.pendingXml);
        window.pendingXml = null;
      }
    };

    window.loadScore = function(xml) {
      if (!isReady || !osmd) {
        window.pendingXml = xml;
        return;
      }
      try {
        osmd.load(xml).then(function() {
          osmd.zoom = 0.88;
          osmd.render();
          if (osmd.cursor) {
            osmd.cursor.show();
            osmd.cursor.reset();
            const elem = osmd.cursor.cursorElement;
            if (elem) {
              elem.classList.add('osmd-cursor');
            }
          }
        }).catch(function(err) {
          console.error('OSMD load error:', err);
        });
      } catch (e) {
        console.error('Exception loading score:', e);
      }
    };

    window.setCursor = function(index, colorHex) {
      if (!osmd || !osmd.cursor) return;
      try {
        osmd.cursor.reset();
        for (let i = 0; i < index; i++) {
          if (!osmd.cursor.iterator.EndReached) {
            osmd.cursor.next();
          }
        }
        const cursorElem = osmd.cursor.cursorElement;
        if (cursorElem) {
          const color = colorHex || '#2563eb';
          cursorElem.style.borderLeftColor = color;
          cursorElem.style.boxShadow = '0 0 8px ' + color;
          cursorElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      } catch (e) {
        console.error('Error in setCursor:', e);
      }
    };
  </script>
</body>
</html>
